name: GCC build and tests
on:
  push:
  pull_request:
jobs:
  windows-mingw:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official SDL3 3.4.2 MinGW SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/libsdl-org/SDL/releases/download/release-3.4.2/SDL3-devel-3.4.2-mingw.zip" -OutFile "${{ runner.temp }}/sdl3.zip"
          Expand-Archive -Path "${{ runner.temp }}/sdl3.zip" -DestinationPath "${{ github.workspace }}"
          Get-ChildItem "${{ github.workspace }}/SDL3-3.4.2" | Select-Object Name
      - name: Download official SDL3_image 3.4.8 MinGW SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/libsdl-org/SDL_image/releases/download/release-3.4.8/SDL3_image-devel-3.4.8-mingw.zip" -OutFile "${{ runner.temp }}/sdl3_image.zip"
          Expand-Archive -Path "${{ runner.temp }}/sdl3_image.zip" -DestinationPath "${{ github.workspace }}"
          Get-ChildItem "${{ github.workspace }}/SDL3_image-3.4.8" | Select-Object Name
      - name: Download SDL3_ttf 3.2.2 MinGW SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/libsdl-org/SDL_ttf/releases/download/release-3.2.2/SDL3_ttf-devel-3.2.2-mingw.tar.gz" -OutFile "${{ runner.temp }}/sdl3_ttf.tar.gz"
          tar -xzf "${{ runner.temp }}/sdl3_ttf.tar.gz" -C "${{ github.workspace }}"
          Get-ChildItem "${{ github.workspace }}/SDL3_ttf-3.2.2" | Select-Object Name
      - name: Inspect actual sprite sheet layout
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tools/audit_sprites.py
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Audit actual hero and armor sprite atlas pixels
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python tools/audit_sprites.py
      - name: Configure, build and test
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
